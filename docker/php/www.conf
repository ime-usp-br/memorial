; =============================================================================
; Pool php-fpm — Memorial IME
; clear_env = no é obrigatório para que as variáveis injetadas pelo
; docker-compose/Portainer cheguem ao Laravel via php-fpm.
; =============================================================================

[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

request_terminate_timeout = 300s

php_admin_value[error_log] = /var/www/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
